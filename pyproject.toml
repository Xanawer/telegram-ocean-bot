[project]
name = "telegram-ocean-bot"
version = "0.1.0"
description = "A privacy-conscious Telegram bot for IPIP Big Five assessments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17,<4",
    "aiohttp>=3.11,<4",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.37,<3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ocean_bot"]
